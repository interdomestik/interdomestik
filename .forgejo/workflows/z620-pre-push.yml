name: Z620 pre-push contract

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

concurrency:
  group: z620-pre-push-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: z620-isolated
    permissions:
      contents: read
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Verify fail-closed permit contract
        run: node --test scripts/ci/z620-push-permit.test.mjs
