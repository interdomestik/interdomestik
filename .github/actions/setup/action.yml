name: 'Interdomestik Setup'
description: 'Standard environment setup for Interdomestik CI'
inputs:
  install-playwright:
    description: 'Whether to install Playwright browsers and deps'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.28.2

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Ensure ripgrep
      shell: bash
      run: |
        set -euo pipefail
        if command -v rg >/dev/null 2>&1; then
          exit 0
        fi

        case "${RUNNER_OS}" in
          Linux)
            if [[ "${RUNNER_ARCH:-}" != "X64" ]]; then
              echo "::error::Pinned ripgrep bootstrap supports only Linux X64, not ${RUNNER_ARCH:-unknown}."
              exit 1
            fi

            RIPGREP_VERSION='15.2.0'
            RIPGREP_TARGET='x86_64-unknown-linux-musl'
            RIPGREP_SHA256='33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c'
            RIPGREP_DIR="ripgrep-${RIPGREP_VERSION}-${RIPGREP_TARGET}"
            RIPGREP_ARCHIVE="${RIPGREP_DIR}.tar.gz"
            RIPGREP_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RIPGREP_ARCHIVE}"
            temp_dir="$(mktemp -d "${RUNNER_TEMP:?}/ripgrep.XXXXXX")"
            install_dir="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}/bin"
            trap 'rm -rf -- "${temp_dir}"' EXIT

            timeout --signal=TERM --kill-after=5s 180s \
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --proto '=https' \
                --proto-redir '=https' \
                --tlsv1.2 \
                --connect-timeout 10 \
                --max-time 120 \
                --retry 2 \
                --retry-delay 2 \
                --retry-max-time 150 \
                --retry-all-errors \
                --max-filesize 5000000 \
                --output "${temp_dir}/${RIPGREP_ARCHIVE}" \
                "${RIPGREP_URL}"

            (
              cd "${temp_dir}"
              printf '%s  %s\n' "${RIPGREP_SHA256}" "${RIPGREP_ARCHIVE}" |
                sha256sum --check --strict -
            )

            tar --extract --gzip \
              --file "${temp_dir}/${RIPGREP_ARCHIVE}" \
              --directory "${temp_dir}" \
              --no-same-owner \
              --no-same-permissions \
              "${RIPGREP_DIR}/rg"
            install -d -m 0755 "${install_dir}"
            install -m 0755 "${temp_dir}/${RIPGREP_DIR}/rg" "${install_dir}/rg"
            "${install_dir}/rg" --version
            printf '%s\n' "${install_dir}" >> "${GITHUB_PATH:?}"
            ;;
          macOS)
            if command -v brew >/dev/null 2>&1; then
              brew install ripgrep
            else
              echo "::error::ripgrep is missing and Homebrew is not available on macOS runner."
              exit 1
            fi
            ;;
          *)
            echo "::error::ripgrep is missing and automatic install is not supported on ${RUNNER_OS}."
            exit 1
            ;;
        esac

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash

    - name: Playwright Browser Cache
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers & Deps
      if: inputs.install-playwright == 'true'
      shell: bash
      run: |
        set -euo pipefail

        # Most CI paths only run Chromium projects; avoid downloading unused engines.
        if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" || "${RUNNER_OS}" != "Linux" ]]; then
          pnpm --filter @interdomestik/web exec playwright install chromium
        else
          pnpm --filter @interdomestik/web exec playwright install --with-deps chromium
        fi
