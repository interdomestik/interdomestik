name: PR E2E (Full Gate)

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
    # Protected checks must always materialize on PRs; the validation-surface
    # policy below skips heavy work for docs-only and other non-product changes.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-preflight:
    name: PR E2E Preflight
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate_policy.outputs.should_run }}
      reason: ${{ steps.gate_policy.outputs.reason }}
      run_full: ${{ steps.gate_policy.outputs.run_full }}
      force_full: ${{ steps.gate_policy.outputs.force_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Evaluate PR gate policy
        id: gate_policy
        uses: ./.github/actions/pr-gate-policy
        with:
          event-name: ${{ github.event_name }}
          event-path: ${{ github.event_path }}

      - name: Report quick draft lane
        if: steps.gate_policy.outputs.should_run != 'true'
        run: echo "PR E2E heavy runner skipped (${{ steps.gate_policy.outputs.reason }})."

  e2e-runner:
    name: PR E2E Runner
    needs:
      - e2e-preflight
    if: needs.e2e-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interdomestik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d interdomestik_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: '1'
      PLAYWRIGHT: '1'
      NEXT_PUBLIC_BILLING_TEST_MODE: '1'
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-secret-for-ci-only-do-not-use-in-production' }}
      NODE_OPTIONS: --max-old-space-size=4096
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          install-playwright: true

      - name: Generate ephemeral E2E credentials
        run: bash scripts/ci/export-e2e-credentials.sh

      - name: Strict Rule Guards (golden/gate)
        run: pnpm --filter @interdomestik/web run e2e:guards

      - name: Run PR E2E Gate
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          E2E_DATABASE_URL_RLS: ${{ env.DATABASE_URL }}
        run: pnpm e2e:gate:pr

      - name: Upload Playwright Artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: playwright-pr-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e:
    name: e2e
    if: always()
    needs:
      - e2e-preflight
      - e2e-runner
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce PR E2E preflight/result contract
        shell: bash
        run: |
          set -euo pipefail
          preflight_result="${{ needs.e2e-preflight.result }}"
          should_run="${{ needs.e2e-preflight.outputs.should_run }}"
          reason="${{ needs.e2e-preflight.outputs.reason }}"
          runner_result="${{ needs.e2e-runner.result }}"

          if [[ "${preflight_result}" != "success" ]]; then
            echo "::error::PR E2E preflight failed before the heavy runner became eligible."
            exit 1
          fi

          if [[ "${should_run}" != "true" ]]; then
            echo "PR E2E heavy runner skipped (${reason})."
            exit 0
          fi

          if [[ "${runner_result}" != "success" ]]; then
            echo "::error::PR E2E runner did not complete successfully (result=${runner_result})."
            exit 1
          fi
