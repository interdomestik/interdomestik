name: Nightly E2E (Strict)

on:
  schedule:
    # Every night at 02:10 UTC
    - cron: '10 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interdomestik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d interdomestik_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: '1'
      PLAYWRIGHT: '1'
      NEXT_PUBLIC_BILLING_TEST_MODE: '1'
      PW_REUSE_SERVER: '1'
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
      DATABASE_URL_RLS: ${{ secrets.E2E_DATABASE_URL_RLS || secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
      E2E_DATABASE_URL_RLS: ${{ secrets.E2E_DATABASE_URL_RLS || secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-secret-for-ci-only-do-not-use-in-production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-playwright: true

      - name: Generate ephemeral E2E credentials
        run: bash scripts/ci/export-e2e-credentials.sh

      - name: DB migrations
        run: pnpm db:migrate

      # ---- Strict-rule guards (fail fast before burning minutes) ----
      - name: Strict Rule Guards (golden/gate)
        run: pnpm --filter @interdomestik/web run e2e:guards

      # ---- Seed (always) ----
      - name: Seed E2E DB
        shell: bash
        run: |
          set -euo pipefail
          pnpm seed:e2e

      # ---- Run suites ----
      - name: Generate Playwright Gate Auth State (KS+MK)
        if: matrix.shardIndex == 1
        run: pnpm e2e:state:setup

      # Gate is fast and tells you immediately if infra drifted.
      - name: E2E Gate (KS+MK)
        if: matrix.shardIndex == 1
        run: pnpm --filter @interdomestik/web run e2e:gate

      # Core subscription lifecycle (Phase 4B), then the flows that change cash data together with
      # the exact branch cash counts (PC04) they could disturb, one test at a time.
      - name: E2E Serial Golden Flows (KS+MK)
        if: matrix.shardIndex == 1
        run: |
          set -euo pipefail
          pnpm --filter @interdomestik/web exec playwright test e2e/golden/subscription-entry.spec.ts --project=ks-sq --project=mk-mk
          pnpm --filter @interdomestik/web exec playwright test e2e/golden/cash-ops.regressions.spec.ts e2e/golden/admin-verification-flow.spec.ts e2e/pc04-branch-cash-truth.spec.ts --project=ks-sq --project=mk-mk --workers=1

      # Phase 5 deterministic batch - SHARDED, on the tenant projects that match golden specs.
      # A sharded run passes with zero selected tests, so the unsharded --list runs first: it exits
      # non-zero when the selection is empty. Smoke already runs separately below.
      - name: E2E Phase 5 Deterministic Batch
        run: |
          set -euo pipefail
          specs=(e2e/golden/agent-pro-leads.spec.ts e2e/golden/agent-leads-drawer.spec.ts e2e/golden/verification-list-ops.spec.ts e2e/golden/verification-details-ops.spec.ts e2e/golden/agent-pro-claims.spec.ts e2e/golden/agent-pro-claims-messaging.spec.ts e2e/golden/rbac-scope.spec.ts e2e/golden/agent-pro-claims-rbac.spec.ts e2e/golden/functional-flows.spec.ts e2e/claim-resolver-isolation.spec.ts e2e/pc05-membership-lifecycle-truth.spec.ts e2e/pc07-cash-verification-states.spec.ts)
          pnpm --filter @interdomestik/web exec playwright test "${specs[@]}" --project=ks-sq --project=mk-mk --list > /dev/null
          pnpm --filter @interdomestik/web exec playwright test "${specs[@]}" --project=ks-sq --project=mk-mk --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Smoke as final sanity
      - name: E2E Smoke
        if: matrix.shardIndex == 1
        run: pnpm --filter @interdomestik/web run test:smoke

      # ---- Artifacts (always on failure; never fail pipeline on quota issues) ----
      - name: Upload Playwright Report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 5
