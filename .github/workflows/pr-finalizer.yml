name: pr-finalizer
run-name: 'PR finalizer [supersession:v1:${{ github.event_name }}:${{ github.event.action }}:${{ github.event.pull_request.head.sha }}]'

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]

concurrency:
  group: pr-finalizer-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-finalizer:
    name: pr-finalizer
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish required compatibility context
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "Compatibility context only; delivery-gate is the authoritative PR decision."
