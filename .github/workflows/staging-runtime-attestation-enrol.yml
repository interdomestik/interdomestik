name: Staging Runtime Attestation Enrolment

# U2-e operation ida.u2e.staging-enrol.v1, owner-approved 2026-11-06 for staging only: provisions
# the staging backend marker and the restricted runtime role's read access to the migration ledger.
# Manual dispatch from main only; the runner refuses until the reviewed staging authority is pinned.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-runtime-attestation-enrol
  cancel-in-progress: false

jobs:
  enrol:
    if: ${{ github.repository == 'interdomestik/interdomestik' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enrol the staging backend marker and ledger read access
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_RLS: ${{ secrets.DATABASE_URL_RLS }}
        run: node scripts/ci/runtime-attestation/enrol-staging.mjs
      - name: Upload sanitized enrolment receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-runtime-attestation-enrol-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/runtime-attestation-enrol/${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: error
          retention-days: 30
