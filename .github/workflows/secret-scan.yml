name: Secret Scan

on:
  push:
    branches:
      - main
      - master
      - 'rc/**'
      - 'release/**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="8.30.0"
          os="$(uname -s)"
          arch="$(uname -m)"

          case "${os}-${arch}" in
            # SHA-256 pins from gitleaks_8.30.0_checksums.txt, cross-checked with release metadata.
            # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.0
            Linux-x86_64)
              archive="gitleaks_${version}_linux_x64.tar.gz"
              asset_id='321137328'
              sha256='79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
              ;;
            Linux-aarch64|Linux-arm64)
              archive="gitleaks_${version}_linux_arm64.tar.gz"
              asset_id='321137500'
              sha256='b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f'
              ;;
            Darwin-x86_64)
              archive="gitleaks_${version}_darwin_x64.tar.gz"
              asset_id='321137635'
              sha256='ca221d012d247080c2f6f61f4b7a83bffa2453806b0c195c795bbe9a8c775ed5'
              ;;
            Darwin-arm64)
              archive="gitleaks_${version}_darwin_arm64.tar.gz"
              asset_id='321137755'
              sha256='b251ab2bcd4cd8ba9e56ff37698c033ebf38582b477d21ebd86586d927cf87e7'
              ;;
            *)
              echo "Unsupported platform for gitleaks: ${os}-${arch}" >&2
              exit 1
              ;;
          esac

          temp_dir="$(mktemp -d "${RUNNER_TEMP:?}/gitleaks.XXXXXX")"
          trap 'rm -rf -- "${temp_dir}"' EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${GH_TOKEN:?}" \
            --header 'Accept: application/octet-stream' \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 2 \
            --retry-max-time 150 \
            --retry-all-errors \
            --max-filesize 10000000 \
            --output "${temp_dir}/${archive}" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${asset_id}"

          (
            cd "${temp_dir}"
            if command -v sha256sum >/dev/null 2>&1; then
              printf '%s  %s\n' "${sha256}" "${archive}" | sha256sum --check --strict -
            else
              printf '%s  %s\n' "${sha256}" "${archive}" | shasum -a 256 --check -
            fi
          )

          tar -xzf "${temp_dir}/${archive}" -C "${temp_dir}" gitleaks
          mkdir -p "$HOME/.local/bin"
          install "${temp_dir}/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Run gitleaks (blocking)
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/gitleaks-artifacts
          log_opts="--all"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_SHA:-}" && -n "${GITHUB_HEAD_SHA:-}" ]]; then
            log_opts="${GITHUB_BASE_SHA}..${GITHUB_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${GITHUB_BEFORE_SHA:-}" && "${GITHUB_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            log_opts="${GITHUB_BEFORE_SHA}..${GITHUB_SHA}"
          fi

          gitleaks git --redact --log-opts="${log_opts}" --report-format sarif --report-path /tmp/gitleaks-artifacts/gitleaks.sarif

      - name: Upload gitleaks report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gitleaks-artifacts/gitleaks.sarif
          if-no-files-found: warn
