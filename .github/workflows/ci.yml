name: CI
on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', 'scripts/repo-size-budget.json']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { actions: read, contents: read, pull-requests: read }
env:
  DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/interdomestik_test' }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-secret-for-ci-only-do-not-use-in-production' }}
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  BETTER_AUTH_URL: http://127.0.0.1:3000
  PORT: 3000
  CI: 'true'
  TURBO_TOKEN: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
  TURBO_TEAM: ${{ github.event_name == 'push' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name == 'push' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
  INTERDOMESTIK_TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
jobs:
  validation-surface:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate_policy.outputs.should_run }}
      non_product_only_paths: ${{ steps.gate_policy.outputs.non_product_only_paths }}
      run_broad: ${{ steps.certification.outputs.run_broad }}
      certification_reason: ${{ steps.certification.outputs.certification_reason }}
      ai_eval_should_run: ${{ steps.gate_policy.outputs.ai_eval_should_run }}
      ai_eval_reason: ${{ steps.gate_policy.outputs.ai_eval_reason }}
      ai_eval_matched_paths: ${{ steps.gate_policy.outputs.ai_eval_matched_paths }}
      main_e2e_reuse: ${{ steps.main_e2e_reuse_safe.outputs.reuse }}
    steps:
      # prettier-ignore
      - { uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8, with: { fetch-depth: 0 } } # v6.0.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve main E2E exact-tree reuse
        id: main_e2e_reuse_raw
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: node scripts/ci/main-e2e-reuse.mjs >> "$GITHUB_OUTPUT"
      - name: Normalize main E2E reuse decision
        id: main_e2e_reuse_safe
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # prettier-ignore
        env: { RESOLVER_RESULT: '${{ steps.main_e2e_reuse_raw.outcome }}:${{ steps.main_e2e_reuse_raw.outputs.reuse }}' }
        run: case "$RESOLVER_RESULT" in success:true) reuse=1 ;; *) reuse=0 ;; esac; echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Evaluate PR gate policy
        id: gate_policy
        uses: interdomestik/interdomestik/.github/actions/pr-gate-policy@f4b39fc4f7fed7e875363807faea11cc2c4cf717
        with:
          event-name: ${{ github.event_name }}
          event-path: ${{ github.event_path }}
      - name: Resolve exact-head certification admission
        id: certification
        uses: interdomestik/interdomestik/.github/actions/exact-head-certification@ecd31cf47a5d2fbd6c164aea0c0c6fcfb686011b
        with:
          policy-json: ${{ toJSON(steps.gate_policy.outputs) }}
  audit:
    needs: [validation-surface]
    runs-on: ubuntu-latest
    steps:
      # prettier-ignore
      - { uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8, with: { ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ida-t115-od17-performance-proof' && github.event.pull_request.head.sha || github.sha }}", persist-credentials: false } } # v6.0.1
      - uses: ./.github/actions/setup
      # prettier-ignore
      - { name: Certify OD17 exact-head public shell, if: "github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ida-t115-od17-performance-proof'", env: { GH_TOKEN: '${{ github.token }}', EXPECTED_HEAD_SHA: '${{ github.event.pull_request.head.sha }}', EXPECTED_TRUSTED_MAIN_SHA: '${{ github.event.pull_request.base.sha }}', PULL_NUMBER: '${{ github.event.pull_request.number }}' }, run: pnpm od17:verify }
      # prettier-ignore
      - { name: Upload OD17 exact-head verdict, if: "always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ida-t115-od17-performance-proof'", uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f, with: { name: 'od17-verdict-${{ github.event.pull_request.head.sha }}', path: tmp/od17-verdict, if-no-files-found: error, retention-days: 7 } } # v6
      - name: Run lightweight governance audits
        run: >-
          pnpm track:audit && pnpm plan:audit && pnpm repo:size:check && node --test scripts/ci/docs-closeout-main-push-contract.test.mjs scripts/ci/z620-parity-policy.test.mjs
      - name: Run Audits
        if: needs.validation-surface.outputs.run_broad == 'true'
        run: |
          node scripts/check-env-ci.mjs
          pnpm test:ci:contracts
          pnpm check:e2e-contracts
          pnpm check:db-access
          pnpm check:architecture-boundaries
          pnpm lint:production-warnings
          pnpm purity:audit
          pnpm db:migrations:check-journal
          # Contract Compliance: pnpm check remains the Golden Path marker.
          # Browser PR coverage lives in the dedicated PR E2E workflow.
          # Push/mainline gate coverage stays in the e2e-gate job below.
      - name: Report quick draft lane
        if: needs.validation-surface.outputs.run_broad != 'true'
        run: |
          echo "Heavy audit lane skipped."
          echo "Reason: ${{ needs.validation-surface.outputs.certification_reason }}"
  static:
    needs: [validation-surface]
    if: needs.validation-surface.outputs.run_broad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Static Checks
        run: |
          pnpm -w lint
          pnpm -w type-check
          pnpm -w check:entrypoints:strict
          pnpm -w i18n:check
          pnpm -w i18n:purity:check --report=tmp/i18n-purity/ci-static-report.json
      - name: Upload i18n purity report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: i18n-purity-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/i18n-purity/
          if-no-files-found: ignore
          retention-days: 30
  unit:
    needs: [validation-surface]
    if: needs.validation-surface.outputs.run_broad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Coverage Gate
        env:
          UPSTASH_REDIS_REST_URL: http://localhost:8080
          UPSTASH_REDIS_REST_TOKEN: dummy-token
        run: pnpm coverage:gate
      - name: Release Gate Unit Tests
        run: pnpm test:release-gate
  ai-eval:
    needs: [validation-surface]
    if: needs.validation-surface.outputs.run_broad == 'true' && needs.validation-surface.outputs.ai_eval_should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run AI Eval Fixtures
        run: pnpm ai:eval
  e2e-gate:
    needs: [validation-surface]
    if: needs.validation-surface.outputs.run_broad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: interdomestik_test }
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d interdomestik_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          install-playwright: ${{ github.event_name != 'pull_request' }}
      - name: Generate ephemeral E2E credentials
        run: bash scripts/ci/export-e2e-credentials.sh
      - name: Enforce E2E Best Practices
        if: github.event_name != 'pull_request'
        run: pnpm --filter @interdomestik/web run e2e:guards
      - name: Prepare E2E Database
        run: |
          pnpm db:migrate
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            pnpm seed:e2e
            pnpm seed:assert-e2e
          fi
      - name: RLS Integration Test
        env:
          REQUIRE_RLS_INTEGRATION: '1'
          REQUIRE_RLS_COVERAGE: '1'
        run: pnpm db:rls:test
      - name: E2E Gate Suite
        if: github.event_name != 'pull_request' && needs.validation-surface.outputs.main_e2e_reuse != '1'
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          E2E_DATABASE_URL_RLS: ${{ env.DATABASE_URL }}
        run: pnpm e2e:gate
