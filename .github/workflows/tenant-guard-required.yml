name: Tenant Guard Required
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: { contents: read }
jobs:
  tenant-db-access:
    name: Protected tenant DB access guard (exact merge)
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed mutable-source sentinel
        run: |
          echo 'S7 owned source-ref sentinel: immutable ruleset pin must ignore this revision'
          exit 1
