name: CD
on:
  workflow_dispatch:
  push: { branches: [main], tags: ['v*'] }
concurrency: { group: 'cd-staging-canonical-${{ github.repository }}', cancel-in-progress: false }
env: { REGISTRY: ghcr.io, IMAGE_NAME: '${{ github.repository }}' }
# prettier-ignore
jobs:
  build-staging:
    runs-on: [self-hosted, interdomestik-z620-staging]
    timeout-minutes: 45
    environment: { name: staging }
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { image_tag: '${{ steps.meta.outputs.version }}', image_digest: '${{ steps.build.outputs.digest }}' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - run: node scripts/ci/cd-runner-preflight.mjs
      - { name: Set up Docker Buildx, uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f, with: { driver: docker-container, name: interdomestik-cd-staging, keep-state: true, cleanup: true } } # v3
      - { name: Verify dedicated Docker builder, run: 'node scripts/ci/cd-runner-preflight.mjs verify-builder' }
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate deterministic image metadata
        id: meta
        shell: bash
        run: >-
          set -euo pipefail; [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid exact commit SHA for staging image metadata."; exit 1; }; [[ "${REGISTRY}" == "ghcr.io" && "${IMAGE_NAME}" == "${GITHUB_REPOSITORY}" && "${GITHUB_SERVER_URL}" == "https://github.com" ]] || { echo "::error::Untrusted staging image metadata context."; exit 1; }; version="staging-${GITHUB_SHA}"; { printf 'version=%s\n' "${version}"; printf 'tags=%s/%s:%s\n' "${REGISTRY}" "${IMAGE_NAME}" "${version}"; printf 'labels<<EOF\norg.opencontainers.image.source=%s/%s\norg.opencontainers.image.revision=%s\norg.opencontainers.image.version=%s\nEOF\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${version}"; } >> "${GITHUB_OUTPUT}"
      - name: Build, attest, and verify Docker image
        id: build
        uses: ./.github/actions/build-attested-image
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          deploy-env: staging
          app-url: https://staging.interdomestik.com
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          supabase-production-project-ref: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF || secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
  deploy-staging:
    needs: build-staging
    runs-on: [self-hosted, interdomestik-z620-staging]
    timeout-minutes: 25
    environment: { name: staging }
    permissions: { contents: read, id-token: write, attestations: write }
    # prettier-ignore
    outputs: { alias_moved: '${{ steps.vercel.outputs.alias_moved }}', base_url: '${{ steps.vercel.outputs.base_url }}', hostname: '${{ steps.vercel.outputs.hostname }}', gate_base_url: '${{ steps.vercel.outputs.gate_base_url }}', gate_hostname: '${{ steps.vercel.outputs.gate_hostname }}' }
    env: { EXPECTED_COMMIT_SHA: '${{ github.sha }}', INTERDOMESTIK_VERCEL_IPV4_ONLY: '1', STAGING_PREIMAGE_RECEIPT_PATH: 'tmp/cd-evidence/${{ github.run_id }}/staging-alias-preimage.json' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - run: node scripts/ci/cd-runner-preflight.mjs
      - name: Deploy Staging to Vercel
        id: vercel
        uses: ./.github/actions/trigger-digest-verified-deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_RLS: ${{ secrets.DATABASE_URL_RLS }}
          ENABLE_VERCEL_DEPLOYMENTS: '1'
          INTERDOMESTIK_VERCEL_IPV4_ONLY: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/ci/cd-runner-preflight.mjs'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        with:
          environment: staging
          production: 'false'
          commit-sha: ${{ github.sha }}
          attested-image-digest: ${{ needs.build-staging.outputs.image_digest }}
          vercel-automation-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Upload staging alias preimage receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-alias-preimage-${{ github.run_id }}
          path: ${{ env.STAGING_PREIMAGE_RECEIPT_PATH }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Wait for Staging Health
        shell: bash
        env:
          BASE_URL: ${{ steps.vercel.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ci/wait-for-vercel-health.mjs "${BASE_URL}/api/health"
      - name: Verify Staging Build Provenance
        shell: bash
        env:
          BASE_URL: ${{ steps.vercel.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ci/fetch-vercel-health.mjs "${BASE_URL}/api/health" "${EXPECTED_COMMIT_SHA}"
      - name: Verify Staging Canonical Alias Provenance
        shell: bash
        env:
          BASE_URL: ${{ steps.vercel.outputs.gate_base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ci/wait-for-vercel-health.mjs "${BASE_URL}/api/health" "${EXPECTED_COMMIT_SHA}"
  e2e-staging:
    needs: deploy-staging
    runs-on: [self-hosted, interdomestik-z620-staging]
    timeout-minutes: 30
    environment: { name: staging, deployment: false }
    permissions: { contents: read }
    env:
      BASE_URL: ${{ needs.deploy-staging.outputs.gate_base_url }}
      AUTH_BASE_URL: https://staging.interdomestik.com
      EVIDENCE_DIR: tmp/cd-evidence/${{ github.run_id }}/staging
      RELEASE_GATE_EXTRA_HOSTNAME: ${{ needs.deploy-staging.outputs.hostname }}
      RELEASE_GATE_EXPECTED_SHA: ${{ github.sha }}
      RELEASE_GATE_ALLOW_DEPLOYMENT_FALLBACK: 'false'
      RELEASE_GATE_MEMBER_EMAIL: ${{ secrets.RELEASE_GATE_MEMBER_EMAIL }}
      RELEASE_GATE_MEMBER_PASSWORD: ${{ secrets.RELEASE_GATE_MEMBER_PASSWORD }}
      RELEASE_GATE_AGENT_EMAIL: ${{ secrets.RELEASE_GATE_AGENT_EMAIL }}
      RELEASE_GATE_AGENT_PASSWORD: ${{ secrets.RELEASE_GATE_AGENT_PASSWORD }}
      RELEASE_GATE_OFFICE_AGENT_EMAIL: ${{ secrets.RELEASE_GATE_OFFICE_AGENT_EMAIL }}
      RELEASE_GATE_STAFF_EMAIL: ${{ secrets.RELEASE_GATE_STAFF_EMAIL }}
      RELEASE_GATE_STAFF_PASSWORD: ${{ secrets.RELEASE_GATE_STAFF_PASSWORD }}
      RELEASE_GATE_ADMIN_KS_EMAIL: ${{ secrets.RELEASE_GATE_ADMIN_KS_EMAIL }}
      RELEASE_GATE_ADMIN_KS_PASSWORD: ${{ secrets.RELEASE_GATE_ADMIN_KS_PASSWORD }}
      RELEASE_GATE_ADMIN_MK_EMAIL: ${{ secrets.RELEASE_GATE_ADMIN_MK_EMAIL }}
      RELEASE_GATE_ADMIN_MK_PASSWORD: ${{ secrets.RELEASE_GATE_ADMIN_MK_PASSWORD }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - run: node scripts/ci/cd-runner-preflight.mjs
      - uses: ./.github/actions/setup
        with: { install-playwright: 'true' }
      - name: Run Staging Release Gate
        shell: bash
        env: { INTERDOMESTIK_VERCEL_IPV4_ONLY: '1', NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/ci/cd-runner-preflight.mjs', VERCEL_AUTOMATION_BYPASS_SECRET: '${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}' }
        run: >-
          set -euo pipefail; mkdir -p "${EVIDENCE_DIR}/logs" "${EVIDENCE_DIR}/release-gates"; pnpm -s release:gate:raw --envName staging --suite p0 --baseUrl "${BASE_URL}" --authBaseUrl "${AUTH_BASE_URL}" --outDir "${EVIDENCE_DIR}/release-gates" 2>&1 | tee "${EVIDENCE_DIR}/logs/release-gate-staging.log"
      - name: Upload staging verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-verification-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/**
          if-no-files-found: error
          retention-days: 14
  rollback-staging-alias:
    if: ${{ always() && !cancelled() && (needs.deploy-staging.result == 'failure' || needs.e2e-staging.result == 'failure') }}
    needs: [deploy-staging, e2e-staging]
    runs-on: [self-hosted, interdomestik-z620-staging]
    timeout-minutes: 10
    environment: { name: staging, deployment: false }
    permissions: { contents: read }
    env: { STAGING_PREIMAGE_RECEIPT_PATH: 'tmp/cd-evidence/${{ github.run_id }}/staging-alias-preimage/staging-alias-preimage.json', STAGING_ROLLBACK_RECEIPT_PATH: 'tmp/cd-evidence/${{ github.run_id }}/staging-alias-rollback.json' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - run: node scripts/ci/cd-runner-preflight.mjs
      - name: Download staging alias preimage receipt
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-alias-preimage-${{ github.run_id }}
          path: tmp/cd-evidence/${{ github.run_id }}/staging-alias-preimage
      - name: Validate staging alias rollback authority
        id: rollback_guard
        if: ${{ always() }}
        shell: bash
        env: { STAGING_ALIAS_MOVED_SIGNAL: '${{ needs.deploy-staging.outputs.alias_moved }}' }
        run: node scripts/ci/configure-vercel-gate-url.mjs guard >> "${GITHUB_OUTPUT}"
      - name: Restore exact staging alias preimage
        if: ${{ success() && steps.rollback_guard.outputs.should_restore == 'true' }}
        shell: bash
        env: { INTERDOMESTIK_VERCEL_IPV4_ONLY: '1', NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/ci/cd-runner-preflight.mjs', STAGING_ALIAS_DOMAIN: staging.interdomestik.com, VERCEL_AUTOMATION_BYPASS_SECRET: '${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}', VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}', VERCEL_ORG_ID: '${{ vars.VERCEL_ORG_ID }}', VERCEL_PROJECT_ID: '${{ vars.VERCEL_PROJECT_ID }}' }
        run: node scripts/ci/configure-vercel-gate-url.mjs restore
      - name: Upload staging alias rollback receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-alias-rollback-${{ github.run_id }}
          path: tmp/cd-evidence/${{ github.run_id }}/staging-alias-rollback.json
          if-no-files-found: error
          retention-days: 14
  production-evidence:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: e2e-staging
    runs-on: ubuntu-latest
    environment: { name: production, deployment: false }
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - uses: ./.github/actions/setup
        with: { install-playwright: 'false' }
      - name: Check Production Human Evidence
        shell: bash
        run: pnpm release:evidence:check
  build-production:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: production-evidence
    runs-on: [self-hosted, interdomestik-mac]
    environment: { name: production }
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { image_tag: '${{ steps.meta.outputs.version }}', image_digest: '${{ steps.build.outputs.digest }}' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with: { driver: docker-container }
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production-${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build, attest, and verify Docker image
        id: build
        uses: ./.github/actions/build-attested-image
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          deploy-env: production
          app-url: https://www.interdomestik.com
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          supabase-production-project-ref: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF || secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-production
    runs-on: [self-hosted, interdomestik-mac]
    timeout-minutes: 25
    environment: { name: production, url: https://www.interdomestik.com }
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - name: Deploy Production to Vercel
        id: vercel
        uses: ./.github/actions/trigger-digest-verified-deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_RLS: ${{ secrets.DATABASE_URL_RLS }}
          ENABLE_VERCEL_DEPLOYMENTS: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        with:
          environment: production
          production: 'true'
          commit-sha: ${{ github.sha }}
          attested-image-digest: ${{ needs.build-production.outputs.image_digest }}
          vercel-automation-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  verify-production:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: deploy-production
    runs-on: [self-hosted, interdomestik-mac]
    timeout-minutes: 20
    environment: { name: production, deployment: false }
    permissions: { contents: read }
    env:
      BASE_URL: https://www.interdomestik.com
      EVIDENCE_DIR: tmp/cd-evidence/${{ github.run_id }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RELEASE_GATE_EXPECTED_SHA: ${{ github.sha }}
      RELEASE_GATE_MEMBER_EMAIL: ${{ secrets.RELEASE_GATE_MEMBER_EMAIL }}
      RELEASE_GATE_MEMBER_PASSWORD: ${{ secrets.RELEASE_GATE_MEMBER_PASSWORD }}
      RELEASE_GATE_AGENT_EMAIL: ${{ secrets.RELEASE_GATE_AGENT_EMAIL }}
      RELEASE_GATE_AGENT_PASSWORD: ${{ secrets.RELEASE_GATE_AGENT_PASSWORD }}
      RELEASE_GATE_OFFICE_AGENT_EMAIL: ${{ secrets.RELEASE_GATE_OFFICE_AGENT_EMAIL }}
      RELEASE_GATE_STAFF_EMAIL: ${{ secrets.RELEASE_GATE_STAFF_EMAIL }}
      RELEASE_GATE_STAFF_PASSWORD: ${{ secrets.RELEASE_GATE_STAFF_PASSWORD }}
      RELEASE_GATE_ADMIN_KS_EMAIL: ${{ secrets.RELEASE_GATE_ADMIN_KS_EMAIL }}
      RELEASE_GATE_ADMIN_KS_PASSWORD: ${{ secrets.RELEASE_GATE_ADMIN_KS_PASSWORD }}
      RELEASE_GATE_ADMIN_MK_EMAIL: ${{ secrets.RELEASE_GATE_ADMIN_MK_EMAIL }}
      RELEASE_GATE_ADMIN_MK_PASSWORD: ${{ secrets.RELEASE_GATE_ADMIN_MK_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      SENTRY_ENVIRONMENT: production
      SENTRY_SEVERITY_THRESHOLD: error
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - uses: ./.github/actions/setup
        with: { install-playwright: 'true' }
      - name: Validate optional Sentry Seer configuration
        shell: bash
        run: |
          set -euo pipefail
          sentry_missing=()
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            [[ -n "${!name:-}" ]] || sentry_missing+=("${name}")
          done
          if (( ${#sentry_missing[@]} == 0 )); then
            echo "SENTRY_SEER_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Skipping Sentry Seer sweep due to missing configuration: ${sentry_missing[*]}"
            echo "SENTRY_SEER_ENABLED=false" >> "$GITHUB_ENV"
          fi
      - name: Open Sentry Seer sweep window
        if: env.SENTRY_SEER_ENABLED == 'true'
        shell: bash
        env:
          SENTRY_SWEEP_CONTEXT: post-deploy verification
        run: bash scripts/sentry-seer-sweep.sh pre
      - name: Health Check
        shell: bash
        run: >-
          set -euo pipefail; mkdir -p "${EVIDENCE_DIR}/logs" "${EVIDENCE_DIR}/notes" "${EVIDENCE_DIR}/release-gates"; node scripts/ci/wait-for-vercel-health.mjs "${BASE_URL}/api/health"
      - name: Verify Production Build Provenance
        shell: bash
        run: node scripts/ci/fetch-vercel-health.mjs "${BASE_URL}/api/health" "${EXPECTED_COMMIT_SHA}"
      - name: Run Production Release Gate
        shell: bash
        run: >-
          set -euo pipefail; mkdir -p "${EVIDENCE_DIR}/logs" "${EVIDENCE_DIR}/release-gates"; pnpm -s release:gate:raw --envName production --suite all --baseUrl "${BASE_URL}" --outDir "${EVIDENCE_DIR}/release-gates" 2>&1 | tee "${EVIDENCE_DIR}/logs/release-gate-production.log"
      - name: Close Sentry Seer sweep window
        if: always() && env.SENTRY_SEER_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        env:
          SENTRY_SWEEP_CONTEXT: post-deploy verification
        run: bash scripts/sentry-seer-sweep.sh post
      - name: Upload production verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-verification-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/logs/*
            ${{ env.EVIDENCE_DIR }}/notes/*
            ${{ env.EVIDENCE_DIR }}/release-gates/*
          if-no-files-found: error
          retention-days: 14
